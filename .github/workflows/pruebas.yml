name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de construcción fijadas
        run: python -m pip install -r docker/requisitos-construccion.txt

      - name: Instalar proyecto y dependencias congeladas
        run: python -m pip install --no-build-isolation -c docker/requisitos-congelados.txt ".[dev]"

      - name: Verificar versiones instaladas
        run: |
          python scripts/verificar_wheelhouse.py --instalados docker/requisitos-congelados.txt docker/requisitos-construccion.txt
          python -m pip check

      - name: Ejecutar pruebas unitarias y de API
        run: python -m pytest -rs tests/unit tests/api --junitxml=reporte-pruebas.xml

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reporte-pruebas.xml
