name: SonarQube de alertas

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarqube-alertas:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_SERVER_IMAGE: sonarqube:26.11.0.134175-community
      SONAR_SCANNER_IMAGE: sonarsource/sonar-scanner-cli:12.3.1.4302_8.3.1
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Arrancar SonarQube Community Build
        run: |
          mkdir -p "$RUNNER_TEMP/sonar-evidencia" "$RUNNER_TEMP/sonar-trabajo"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sonar-evidencia/sha.txt"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          docker info --format '{{.ServerVersion}}'
          sudo sysctl -w vm.max_map_count=524288
          if [ "$(sysctl -n fs.file-max)" -lt 131072 ]; then
            sudo sysctl -w fs.file-max=131072
          fi
          docker run --detach --name sobusa-sonarqube \
            --publish 127.0.0.1:9100:9000 --memory 5g \
            --ulimit nofile=131072:131072 --ulimit nproc=8192:8192 \
            "$SONAR_SERVER_IMAGE"

      - name: Analizar el SHA y guardar la puerta de calidad
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import secrets
          import subprocess
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = "http://127.0.0.1:9100"
          project = "sobusa-frecuencias"
          sha = os.environ["PR_HEAD"]
          temp = Path(os.environ["RUNNER_TEMP"])
          work = temp / "sonar-trabajo"
          evidence = temp / "sonar-evidencia"

          def api(path, *, query=None, form=None, password=None, starting=False):
              url = f"{host}/{path}" + (f"?{urlencode(query)}" if query else "")
              headers = {}
              if password is not None:
                  basic = base64.b64encode(f"admin:{password}".encode()).decode()
                  headers["Authorization"] = f"Basic {basic}"
              request = Request(url, data=urlencode(form).encode() if form else None, headers=headers)
              try:
                  with urlopen(request, timeout=10) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except HTTPError as exc:
                  if starting and exc.code in (502, 503, 504):
                      raise
                  raise RuntimeError(f"SonarQube {path}: HTTP {exc.code}") from None

          def save(name, value):
              (evidence / name).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def wait_for_server():
              deadline = time.monotonic() + 300
              last_status = "sin respuesta"
              while time.monotonic() < deadline:
                  try:
                      health = api("api/system/status", starting=True)
                      if health["status"] == "UP":
                          return health
                      last_status = health["status"]
                  except (URLError, ConnectionError, TimeoutError) as exc:
                      last_status = f"{type(exc).__name__}: {exc}"

                  result = subprocess.run([
                      "docker", "inspect", "--format", "{{json .State}}", "sobusa-sonarqube",
                  ], check=True, capture_output=True, text=True)
                  state = json.loads(result.stdout)
                  if not state["Running"]:
                      raise SystemExit(
                          f"SonarQube se detuvo durante el arranque: {state['Status']}, "
                          f"código {state['ExitCode']}, OOMKilled={state['OOMKilled']}. "
                          f"Última comprobación: {last_status}"
                      )
                  time.sleep(3)
              raise SystemExit(
                  f"SonarQube no alcanzó UP en el puerto 9100 en 300 s. "
                  f"Última comprobación: {last_status}"
              )

          health = wait_for_server()
          save("servidor.json", health)

          # El usuario inicial viene con la imagen. Su contraseña se rota antes de crear el proyecto.
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}", flush=True)
          api("api/users/change_password", password="admin",
              form={"login": "admin", "previousPassword": "admin", "password": password})
          api("api/projects/create", password=password, form={
              "project": project, "name": "SOBUSA frecuencias",
          })
          token = api("api/user_tokens/generate", password=password, form={
              "name": "sobusa-ci", "type": "PROJECT_ANALYSIS_TOKEN", "projectKey": project,
          })["token"]
          print(f"::add-mask::{token}", flush=True)

          exclusions = ",".join((
              "**/.env*", "**/datos/**", "**/data/**", "**/respaldo*/**", "**/*backup*",
              "**/modelos/**", "**/models/**", "**/wheelhouse/**", "**/resultados*/**",
              "**/__pycache__/**", "**/.venv/**", "**/venv/**", "**/docs/**",
          ))
          subprocess.run([
              "docker", "run", "--rm", "--network", "host",
              "--user", f"{os.getuid()}:{os.getgid()}",
              "-e", "SONAR_TOKEN", "-e", "SONAR_USER_HOME=/work/cache",
              "-v", f"{Path.cwd()}:/src:ro", "-v", f"{work}:/work",
              "-w", "/src", "--entrypoint", "sonar-scanner",
              os.environ["SONAR_SCANNER_IMAGE"],
              f"-Dsonar.host.url={host}", f"-Dsonar.projectKey={project}",
              f"-Dsonar.scm.revision={sha}", f"-Dsonar.projectVersion={sha}",
              "-Dsonar.sources=app,migrations,Dockerfile", "-Dsonar.tests=tests",
              f"-Dsonar.exclusions={exclusions}", f"-Dsonar.test.exclusions={exclusions}",
              "-Dsonar.working.directory=/work/scanner",
              "-Dsonar.scanner.metadataFilePath=/work/report-task.txt",
          ], check=True, env={**os.environ, "SONAR_TOKEN": token})

          metadata = dict(line.split("=", 1) for line in
                          (work / "report-task.txt").read_text().splitlines() if "=" in line)
          task_id = metadata["ceTaskId"]
          for _ in range(90):
              task = api("api/ce/task", query={"id": task_id}, password=password)["task"]
              if task["status"] == "SUCCESS":
                  break
              if task["status"] not in ("PENDING", "IN_PROGRESS"):
                  raise SystemExit(f"Compute Engine: {task['status']} (tarea {task_id})")
              time.sleep(3)
          else:
              raise SystemExit(f"Compute Engine no terminó (tarea {task_id})")

          analysis_id = task["analysisId"]
          gate = api("api/qualitygates/project_status",
                     query={"analysisId": analysis_id}, password=password)
          save("puerta-calidad.json", gate)
          analyses = api("api/project_analyses/search",
                         query={"project": project}, password=password)["analyses"]
          analysis = next(item for item in analyses if item["key"] == analysis_id)
          if analysis.get("revision") != sha:
              raise SystemExit(f"SonarQube registró una revisión distinta de {sha}")
          save("analisis.json", {"sha": sha, "analysisId": analysis_id, "taskId": task_id})

          issues = []
          page = 1
          while True:
              result = api("api/issues/search", query={
                  "componentKeys": project, "p": page, "ps": 500,
              }, password=password)
              issues.extend(result["issues"])
              if len(issues) == result["paging"]["total"]:
                  break
              if not result["issues"] or len(issues) > result["paging"]["total"]:
                  raise SystemExit("Paginación incompleta en api/issues/search")
              page += 1

          vulnerabilities = [item for item in issues if item["type"] == "VULNERABILITY"]
          critical = [item for item in issues if item["severity"] in ("CRITICAL", "BLOCKER")]
          fields = ("rule", "type", "severity", "component", "line", "message", "impacts")
          status = gate["projectStatus"]["status"]
          summary = {
              "sha": sha, "qualityGate": status,
              "vulnerabilities": len(vulnerabilities), "criticalOrBlocker": len(critical),
              "findings": [{key: item[key] for key in fields if key in item}
                           for item in issues if item in vulnerabilities or item in critical],
          }
          save("hallazgos.json", summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(f"### SonarQube Community Build\n\n"
                           f"- SHA: `{sha}`\n- Puerta de calidad: **{status}**\n"
                           f"- Vulnerabilidades: {len(vulnerabilities)}\n"
                           f"- Hallazgos críticos o bloqueantes: {len(critical)}\n")
          if status != "OK" or vulnerabilities or critical:
              raise SystemExit("La puerta de calidad o el criterio RNF-013 no se cumple")
          PY

      - name: Recoger diagnóstico del servidor y eliminar la instancia
        if: always()
        run: |
          if docker inspect sobusa-sonarqube >/dev/null 2>&1; then
            docker inspect --format '{{json .State}}' sobusa-sonarqube \
              | tee "$RUNNER_TEMP/sonar-evidencia/estado-contenedor.json"
            docker logs --timestamps sobusa-sonarqube > "$RUNNER_TEMP/sonar-evidencia/servidor.log" 2>&1 || true
            docker rm -fv sobusa-sonarqube
          fi

      - name: Guardar evidencia de SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-alertas-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sonar-evidencia/
          if-no-files-found: error
